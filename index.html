<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4355ff" />
  <meta name="description"
    content="Ứng dụng flashcard tiếng Nhật mobile-first với SRS, import nhanh, luyện tập và thống kê." />
  <title>Đức Trí - Flashcard tiếng Nhật</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (var r of regs) r.unregister();
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (var name of names) caches.delete(name);
      });
    }
  </script>
  <link rel="stylesheet" href="styles.css?v=3" />
</head>

<body>
  <div id="app"></div>

  <input id="filePicker" type="file" hidden accept=".txt,.csv,.tsv,.json" />

  <script type="module" src="app.js?v=3"></script>
</body>

</html>
